services:
  app:
    container_name: mercier-web
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/mercier.sqlite3
    ports:
      - "127.0.0.1:8091:8000"
    volumes:
      - mercier_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
volumes:
  mercier_data:
