{% extends 'base.html' %}{% block content %}<div class="narrow page-intro"><a class="back" href="{% url 'dashboard' %}">← Ma carte</a><span class="eyebrow">AJOUTER UN ACHAT</span><h1>Un code, <em>des tampons.</em></h1><p>Tu as reçu un code après ton achat ? Saisis-le ici pour l’ajouter à ta carte.</p><div class="panel form-panel"><form method="post">{% csrf_token %}<div class="field"><label for="code">Code d’achat</label><input id="code" name="code" value="{{ request.GET.code|default:'' }}" required maxlength="32" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off"></div><button class="button primary">Valider mon achat <span>↗</span></button></form><p class="muted">Chaque code ne sert qu’une seule fois et expire après 30 jours.</p></div></div>{% endblock %}
